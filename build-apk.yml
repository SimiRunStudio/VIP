name: Build Asmaron Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: asmaron-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify repository root and branding assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $GITHUB_WORKSPACE"
          test -f package.json || { echo "ERROR: package.json must be in repository root"; exit 1; }
          test -f app.json || { echo "ERROR: app.json must be in repository root"; exit 1; }
          test -f assets/branding.png || { echo "ERROR: assets/branding.png missing. Upload the COMPLETE assets folder at repository root."; find . -maxdepth 3 -type f | sort | head -200; exit 1; }
          test -f assets/app-icon.png || { echo "ERROR: assets/app-icon.png missing"; exit 1; }
          test -f assets/splash-logo.png || { echo "ERROR: assets/splash-logo.png missing"; exit 1; }
          test -f .github/workflows/build-apk.yml || { echo "ERROR: workflow file missing"; exit 1; }
          file assets/branding.png assets/app-icon.png assets/splash-logo.png

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asmaron-Supreme-v19-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
